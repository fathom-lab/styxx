on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: go mod download
      - name: Tests
        run: |
          set -eo pipefail
          go vet ./...
          go test ./... -race -count=1
          echo "tests finished"
