on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        run: sudo apt-get install -y k6
      - name: Load test
        run: |
          set -eo pipefail
          k6 run --out json=k6-results.json load-test.js
      - name: Report
        run: echo "done"
