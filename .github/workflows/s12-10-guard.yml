on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: npm test
      - name: No focused tests
        run: |
          if grep -rn "it.only(" tests/; then
            echo "::error::a focused test was left in"
            exit 1
          fi
