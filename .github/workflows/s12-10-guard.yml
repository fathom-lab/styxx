on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: npm test
      - name: No focused tests
        run: |
          __rc=0; grep -rn "it.only(" tests/ || __rc=$?
          if [ "$__rc" -gt 1 ]; then echo "guard command failed (exit $__rc): grep -rn \"it.only(\" tests/" >&2; exit "$__rc"; fi
          if [ "$__rc" -eq 0 ]; then
            echo "::error::a focused test was left in"
            exit 1
          fi
