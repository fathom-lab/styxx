on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Typecheck
        run: |
          set -eo pipefail
          npm run typecheck
      - name: Upload the log
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
