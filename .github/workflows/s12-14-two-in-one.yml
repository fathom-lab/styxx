on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install -e .[dev]
      - name: Type check
        run: |
          set -eo pipefail
          mypy src
      - name: Build wheel
        run: python -m build
      - name: Unit tests
        run: python -m pytest -q
