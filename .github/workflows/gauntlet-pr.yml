name: gauntlet PR verification

# When an external researcher PRs against `submissions/`, this workflow
# re-runs the styxx gauntlet against their method and verifies the scores
# they reported match what the gauntlet actually produces.
#
# It claimed that from the day it was written and did not do it: see the
# comment in "Discover changed submissions" below. The claim is only as good
# as the discovery step under it, so tests/test_gauntlet_pr_verifies_something.py
# runs that step's shell and asserts a comparison that cannot be made fails
# rather than reporting an empty change set.

on:
  pull_request:
    paths:
      - 'submissions/**'
      - 'LEADERBOARD.md'

permissions:
  contents: read

jobs:
  verify-submissions:
    name: re-run gauntlet on submitted methods
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install styxx (editable, with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          # Submitters typically need their own deps; install them per-submission.

      - name: Discover changed submissions
        id: discover
        run: |
          set -euo pipefail
          # This step used to read:
          #
          #   changed_dirs=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
          #     -- 'submissions/' | awk ... | sort -u || true)
          #
          # `origin/<base>` is not in this checkout. actions/checkout@v4 at its default
          # fetch-depth: 1 fetches exactly one refspec for a pull_request event --
          # `+<sha>:refs/remotes/pull/<n>/merge` (see actions/checkout, src/ref-helper.ts,
          # getRefSpec) -- and no refs/remotes/origin/* at all. So the diff failed with
          # "unknown revision", the `|| true` turned that failure into an empty list, every
          # later step was skipped by `if: steps.discover.outputs.dirs != ''`, and the job
          # reported "nothing to verify" and went green. On a workflow whose header says the
          # leaderboard is trustworthy because no submission lands without CI verification.
          #
          # .github/workflows/leaderboard-submission.yml, which handles the other submission
          # protocol, already fetched its base ref before diffing. This one now does too.
          base_sha="${{ github.event.pull_request.base.sha }}"
          if ! git fetch --no-tags --depth=1 origin "$base_sha"; then
            echo "::error::could not fetch the base commit $base_sha, so the diff cannot be taken. 'The comparison could not be made' is not the same fact as 'this PR changes no submission', and this job must never report the first as the second."
            exit 1
          fi
          # Two-dot against the base commit, not three-dot against a branch tip: HEAD here is
          # the pull_request merge commit, whose parents are the base and the head, so the
          # two-dot diff IS the PR's change set -- and it needs no merge base, which a pair of
          # depth-1 fetches may not share. No `|| true` anywhere below.
          changed=$(git diff --name-only "$base_sha" HEAD -- 'submissions/')
          echo "files changed under submissions/:"
          printf '%s\n' "${changed:-(none)}"
          # A gauntlet submission is a DIRECTORY: submissions/<name>/{method.py,submission.json}.
          # A flat submissions/<name>.py is a Cognometry Detector Interface v0 submission and
          # belongs to leaderboard-submission.yml, so this filter dropping it is correct and
          # not a miss -- submissions/GAUNTLET.md documents the two protocols side by side.
          changed_dirs=$(printf '%s\n' "$changed" | awk -F/ 'NF >= 3 {print $1"/"$2}' | sort -u)
          echo "gauntlet submissions to verify:"
          printf '%s\n' "${changed_dirs:-(none)}"
          {
            echo "dirs<<EOF"
            printf '%s\n' "$changed_dirs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install per-submission requirements
        if: steps.discover.outputs.dirs != ''
        run: |
          set -e
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            if [ -f "$d/requirements.txt" ]; then
              echo "installing $d/requirements.txt"
              pip install -r "$d/requirements.txt"
            fi
          done <<< "${{ steps.discover.outputs.dirs }}"

      - name: Re-run gauntlet on each changed submission
        if: steps.discover.outputs.dirs != ''
        run: |
          set -e
          fail=0
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            name=$(basename "$d")
            echo "=== verifying $d ==="
            # Each submission must include a submission.json declaring:
            #   { "method": "submissions.<dir>.method:predict",
            #     "task": "classification" | "detection",
            #     "name": "human-readable name",
            #     "reported": { ... gauntlet result fields ... } }
            if [ ! -f "$d/submission.json" ]; then
              echo "  ERROR: $d/submission.json missing; submitters must include it"
              fail=1
              continue
            fi
            method=$(python -c "import json; print(json.load(open('$d/submission.json'))['method'])")
            task=$(python -c "import json; print(json.load(open('$d/submission.json'))['task'])")
            sub_name=$(python -c "import json; print(json.load(open('$d/submission.json'))['name'])")
            echo "  method: $method"
            echo "  task:   $task"
            python -m styxx gauntlet --method "$method" --task "$task" --name "$sub_name" --format json > "$d/_ci_verify.json"
            # Compare to reported scores (n_passed, overall_pass, top-level metrics keys present)
          python - <<PY
          import json, sys, pathlib
          sub = json.load(open(pathlib.Path("$d") / "submission.json"))
          verify = json.load(open(pathlib.Path("$d") / "_ci_verify.json"))
          reported = sub.get("reported", {})
          mismatches = []
          for k in ("overall_pass", "n_passed", "n_total_bars"):
              if k in reported and reported[k] != verify[k]:
                  mismatches.append(f"  {k}: reported={reported[k]} ci={verify[k]}")
          if "metrics" in reported:
              for k, v in reported["metrics"].items():
                  cv = verify["metrics"].get(k)
                  if cv is None: continue
                  if isinstance(v, float) and isinstance(cv, float):
                      if abs(v - cv) > 1e-3:
                          mismatches.append(f"  metrics.{k}: reported={v} ci={cv}")
                  elif v != cv:
                      mismatches.append(f"  metrics.{k}: reported={v} ci={cv}")
          if mismatches:
              print("VERIFICATION FAILED — submitter's reported numbers don't match CI run:")
              for m in mismatches:
                  print(m)
              sys.exit(2)
          print("VERIFICATION PASSED — reported numbers match CI run")
          PY
          done <<< "${{ steps.discover.outputs.dirs }}"
          exit $fail

      - name: No submissions changed
        if: steps.discover.outputs.dirs == ''
        run: |
          echo "no submissions/ files changed in this PR — nothing to verify"
