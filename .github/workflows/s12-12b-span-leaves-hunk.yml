on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration
        run: |
          echo "integration tests"
          echo "database: $DATABASE_URL"
          echo "seed: $SEED"
          echo "shard: 1 of 1"
          npm run test:integration
      - name: Report
        if: always()
        run: echo "integration finished"
