name: "styxx prereg-ci"
description: >-
  A sealed decision, the verdict it gives, and the sentences that rest on it. On a pull request it
  re-derives the verdict of every receipt the pull request writes, or a RESULT it changes names, from
  the PREREG's sealed bytes (the gates table, or the locked scorer at its sealed blobs), and refuses a
  receipt or RESULT whose verdict differs, a receipt scored under a decision digest no seal holds, a
  committed receipt rewritten in place, a sealed decision edited, and a shipped surface that still
  prints a sentence the landed row withdraws. It prints the time ladder, the outcome ladder with each
  gate's margin, the single-gate flip table and what it did not examine, into the job summary and a
  JSON report (styxx.prereg-ci/report/v0). Exit codes are the command's: 0 PASS, 1 FAIL, 2 an input
  error, 3 UNCHECKABLE, 4 an internal error (ERROR: no verdict was read). The step is report-only by
  default: report-only "true" writes the verdict, the report and the summary and exits 0 on every
  verdict, so the check blocks nothing until a caller sets report-only "false", which passes the
  command's exit code on. It needs full history: the checkout this action runs (checkout "true")
  checks out the head commit with fetch-depth: 0 and the partial-clone filter blob:none, so the head's
  blobs come in the checkout's one batch and git fetches the older blobs the check reads from the
  repository's own remote while it runs; a caller that checks out itself sets checkout "false", uses
  fetch-depth: 0, and keeps a working tree checked out (with blob:none and no checkout, every blob
  read is fetched on its own). Grant the job contents: read and nothing else, and pin this action by
  commit sha in the uses: line. Both python steps run with -I, so the checked-out pull request (the
  working directory), PYTHONPATH and the user site stay off the import path and a pull request cannot
  replace the code that judges it; for the same reason a repository whose own tree holds styxx (styxx
  itself) pins fathom-lab/styxx/prereg-ci@<sha> and never uses: ./prereg-ci, whose styxx-source
  default installs the pull request's own tree. The check opens no connection of its own: no
  time-stamp authority, no OpenTimestamps calendar, no forge API (the server rung prints "not read").
  A locks PREREG's scorer runs as code (python -I -S with a timeout, its network removed only where a
  Linux runner permits it; not a sandbox), so the check runs one only from blobs the base commit
  holds: a locks PREREG, or a locked file, that the pull request brings reads SCORER_NOT_RUN (exit 3)
  until it lands. The checkout keeps the job's token in .git/config for the partial clone's fetches,
  and a landed scorer runs beside it: run this action on pull_request, never under
  pull_request_target, and with no secret in the job. Workflow commands are stopped while the check
  prints, so a receipt's bytes cannot write an annotation into the log.
  Policies come from prereg-ci.toml as the base commit holds it, and an input here wins over the file.
author: "Fathom Lab"
branding:
  icon: "check-square"
  color: "gray-dark"

inputs:
  base:
    description: >-
      The base commit: the pull request's target (on a push, the commit before it). The default
      serves pull_request and push events; a push that creates a branch carries 40 zeros as its
      before, and other events carry neither, so name the base there (the check reads COMMIT_ABSENT,
      exit 3, otherwise).
    required: false
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  head:
    description: "The head commit: the pull request's head (on a push, the pushed commit)."
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  checkout:
    description: >-
      Run actions/checkout with fetch-depth: 0 and filter: blob:none before the check. Set "false"
      when the job has checked out the repository itself with full history.
    required: false
    default: "true"
  report-only:
    description: >-
      "true" (the default) prints the verdict, writes the report and the outputs, and exits 0 on every
      verdict (the lab runs it so through its measurement window); "false" passes the command's exit
      code on, so a FAIL fails the step.
    required: false
    default: "true"
  immutability:
    description: "C0 policy: gates (prose moved around a sealed fence is printed) or file (refused). Empty: the config, else gates."
    required: false
    default: ""
  amend-after-data:
    description: "C4 policy: report or fail an amendment that governs after a receipt under the old decision. Empty: the config, else report."
    required: false
    default: ""
  receipt-rewrite:
    description: "C1 policy: fail or note a committed receipt changed in place. Empty: the config, else fail."
    required: false
    default: ""
  require-time:
    description: "The rung a seal must read: T1 (author order) or T3a (an RFC 3161 token verified offline). Empty: the config, else T1."
    required: false
    default: ""
  preregistered-word:
    description: "A RESULT that calls itself preregistered below T3a: note or fail. Empty: the config, else note."
    required: false
    default: ""
  exclude:
    description: "Repository-relative path prefixes the pairing and the licence scan leave out, one per line. Empty: the config's."
    required: false
    default: ""
  out-dir:
    description: "Where the JSON report is written."
    required: false
    default: "${{ runner.temp }}/prereg-ci"
  python-version:
    description: "Run actions/setup-python with this version before anything else; empty uses the job's Python."
    required: false
    default: ""
  styxx-source:
    description: >-
      What to pip install to get styxx.prereg_ci. Default: the action's own checkout, so the checker is
      the bytes at the commit the action is pinned to (under uses: ./prereg-ci that checkout is the
      pull request's tree, so pin the remote form). Empty skips the install because the job already
      installed it.
    required: false
    default: "${{ github.action_path }}/.."

outputs:
  verdict:
    description: "PASS, FAIL, INPUT_ERROR, UNCHECKABLE or ERROR (an exit code outside 0-3)."
    value: ${{ steps.check.outputs.verdict }}
  exit-code:
    description: "The command's exit code (0, 1, 2, 3, or 4 for ERROR), whatever report-only does with it."
    value: ${{ steps.check.outputs.exit-code }}
  report:
    description: "Path of the JSON report (styxx.prereg-ci/report/v0)."
    value: ${{ steps.check.outputs.report }}

runs:
  using: "composite"
  steps:
    - if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v4
      with:
        # the head commit's tree is the one the check reads, so its blobs arrive in the checkout's one batch;
        # history's blobs are fetched as the check reads them
        ref: ${{ inputs.head }}
        fetch-depth: 0
        filter: blob:none
    - if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - if: ${{ inputs.styxx-source != '' }}
      shell: bash
      env:
        STYXX_SOURCE: ${{ inputs.styxx-source }}
      # -I: the working directory (the pull request's tree), PYTHONPATH and the user site stay off sys.path
      run: python -I -m pip install --quiet --disable-pip-version-check "$STYXX_SOURCE"
    - id: check
      shell: bash
      env:
        # every input reaches the shell through the environment; none is spliced into the script
        PREREG_CI_BASE: ${{ inputs.base }}
        PREREG_CI_HEAD: ${{ inputs.head }}
        PREREG_CI_REPORT_ONLY: ${{ inputs.report-only }}
        PREREG_CI_IMMUTABILITY: ${{ inputs.immutability }}
        PREREG_CI_AMEND_AFTER_DATA: ${{ inputs.amend-after-data }}
        PREREG_CI_RECEIPT_REWRITE: ${{ inputs.receipt-rewrite }}
        PREREG_CI_REQUIRE_TIME: ${{ inputs.require-time }}
        PREREG_CI_PREREGISTERED_WORD: ${{ inputs.preregistered-word }}
        PREREG_CI_EXCLUDE: ${{ inputs.exclude }}
        PREREG_CI_OUT: ${{ inputs.out-dir }}
      run: |
        set -u
        mkdir -p "$PREREG_CI_OUT"
        report="$PREREG_CI_OUT/report.json"
        args=(check --base "$PREREG_CI_BASE" --head "$PREREG_CI_HEAD" --json "$report")
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then args+=(--summary "$GITHUB_STEP_SUMMARY"); fi
        if [ -n "$PREREG_CI_IMMUTABILITY" ]; then args+=(--immutability "$PREREG_CI_IMMUTABILITY"); fi
        if [ -n "$PREREG_CI_AMEND_AFTER_DATA" ]; then args+=(--amend-after-data "$PREREG_CI_AMEND_AFTER_DATA"); fi
        if [ -n "$PREREG_CI_RECEIPT_REWRITE" ]; then args+=(--receipt-rewrite "$PREREG_CI_RECEIPT_REWRITE"); fi
        if [ -n "$PREREG_CI_REQUIRE_TIME" ]; then args+=(--require-time "$PREREG_CI_REQUIRE_TIME"); fi
        if [ -n "$PREREG_CI_PREREGISTERED_WORD" ]; then args+=(--preregistered-word "$PREREG_CI_PREREGISTERED_WORD"); fi
        while IFS= read -r prefix; do
          prefix="${prefix%$'\r'}"
          if [ -n "$prefix" ]; then args+=(--exclude "$prefix"); fi
        done <<< "$PREREG_CI_EXCLUDE"
        code=0
        # the printout carries text a receipt or a RESULT wrote: the runner reads no workflow command
        # (::error::, ::add-mask::) from it until the token, which the pull request cannot know, resumes them
        token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n\r')"
        if [ "${#token}" -ne 32 ]; then echo "prereg-ci: no token to stop workflow commands with"; exit 4; fi
        echo "::stop-commands::$token"
        # -I keeps the pull request's tree off sys.path, so the installed checker judges it; -X utf8
        # fixes the printout's encoding, which -I no longer takes from PYTHONIOENCODING
        python -I -X utf8 -m styxx.prereg_ci "${args[@]}" || code=$?
        echo "::$token::"
        case "$code" in
          0) verdict=PASS ;;
          1) verdict=FAIL ;;
          2) verdict=INPUT_ERROR ;;
          3) verdict=UNCHECKABLE ;;
          *) verdict=ERROR ;;
        esac
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          {
            echo "verdict=$verdict"
            echo "exit-code=$code"
            echo "report=$report"
          } >> "$GITHUB_OUTPUT"
        fi
        if [ "$PREREG_CI_REPORT_ONLY" = "true" ]; then
          echo "prereg-ci: $verdict (exit $code); report-only, so this step exits 0"
          exit 0
        fi
        exit "$code"
