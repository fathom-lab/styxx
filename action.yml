name: "styxx diffgate"
description: >-
  The claim "an agent's PR summary cannot lie about its diff" is not yet true of this
  instrument on real-world data: EXTERNAL-1 measured accusation precision 0.23 against a
  preregistered 0.95 floor, and its preregistration (PREREG_external1_aidev_2026_08_31.md)
  committed the lab to say so in those words. The Action extracts diff-shaped claims from the
  PR body (or push commit message) and verifies each against the actual diff — checkout-free,
  via the GitHub API. It gates two events: pull_request (the description against the pull
  request's diff) and push (the head commit's message against the compare diff). On any other
  event, pull_request_target and merge_group among them, it reads no claim, prints a line saying
  the event is not gated, and the job passes whatever soft-fail and strict are set to. The text
  is read in its Markdown source, so an HTML comment, a task-list item and a sentence inside a
  code fence are read like any other sentence. Where the runner's environment names a proxy for
  the API's host the request goes through it, and a proxy in front of a plain-http API origin
  reads the workflow token. A request that GitHub answers with 429, with 500 to 599, or with a
  403 that carries a rate limit's headers is asked again, to the same address: at most three
  requests for one address and at most 120 seconds of waiting in a run. By default it reports
  and does not block: where the gate read the
  diff, each claim has a row in the job summary's table (up to 524,288 bytes of rows; the claims
  past that are counted by verdict), an error command is printed for every contradicted claim
  (with strict, for every claim the gate could not check too), and a warning command for at most
  100 of the other claims the gate could not check. GitHub's documentation of its checks API says
  "GitHub Actions are limited to 10 warning annotations and 10 error annotations per step", so a
  command past the tenth of its kind may be shown as no annotation: read the table. The job fails on a
  contradicted claim only if you set soft-fail: "false". With soft-fail: "false" the job also
  fails on a claim the gate
  reports UNCHECKABLE because its PATH-2a overlay withheld a CONTRADICTED reading of it, and on a
  diff it could not fetch or did not measure while the description holds a claim the gate reads
  (GitHub refuses a diff past its size limit; a push that creates a branch has no base commit
  to compare with). A push that creates a tag is not gated. It does not block by default because
  no kind of accusation it still makes has been measured clearing the 0.95 precision floor the
  lab set for accusing.
  The papers and receipts named here are under papers/closed-model-frontier/. A path claim
  the diff does not show is no longer accused: the 100 accusations EXTERNAL-1 sampled from
  71,016 eligible external agent-authored PRs, 85 of them path claims, measured precision 0.23
  (23 upheld by a blind three-seat panel) against a preregistered 0.95 floor (2026-08-31,
  RESULT_external1_the_gate_fails_in_the_wild_2026_08_31.md, receipts
  external1_adjudication.json and external1_summary.json), and a repaired path accuser
  measured 0.16 on a held-out sample (V14, 2026-09-01,
  RESULT_v14_naming_the_defects_did_not_save_it_2026_09_01.md, receipt v14_adjudication.json),
  so that accusation is reported UNCHECKABLE until a held-out repair clears the floor. Of the
  kinds that still accuse, only_touches is the one with a measured precision: 0.25, 2 of 8
  accusations correct across 299 only_touches claims in 568 AIDev PRs (PATH-1, 2026-09-17,
  RESULT_path1_only_touches_repair_2026_09_17.md), re-derived by SCOPE-1 (2026-09-18,
  RESULT_scope1_ABANDONED_2026_09_18.md, receipt scope1_footprint.json) against
  styxx/diffgate.py at sha256 9b620e00…, the reader in 7.48.0 and 7.48.1; @main runs that
  reader under the PATH-2a overlay, which can withhold a verdict and never adds an accusation.
  No committed RESULT states a precision for the other kinds that accuse (tests_added,
  symbol_added, files_changed_count). It judges a CLOSED template set (touched/created/deleted
  paths, added functions and tests, file counts, only-touches scopes, tests-pass); prose
  outside it is never scored. The sweep harness is committed
  (scripts/diffgate_validation_sweep.py) so you can re-run our numbers rather than take our
  word for them; the README says which of our own earlier numbers that harness withdrew.
author: "Fathom Lab"
branding:
  icon: "shield"
  color: "gray-dark"

inputs:
  strict:
    description: >-
      UNCHECKABLE claims (e.g. 'tests pass' with no way to run them) also fail the gate. The job
      fails on them only when soft-fail is "false". With soft-fail "false", strict also fails the
      job on a diff that could not be fetched or that the gate did not measure, whatever a
      non-empty description holds (an empty one is not gated); without strict a blocking job fails
      there only when the description holds a claim the gate reads. The value is read as
      soft-fail's is: compared case-insensitively with surrounding whitespace stripped. "true"
      is strict and "false" (the default) is not. Any other value, the empty string included, is
      not strict and prints a warning naming the value.
    required: false
    default: "false"
  soft-fail:
    description: >-
      Only an explicit "false" blocks. The value is compared case-insensitively with surrounding
      whitespace stripped. "true" (the default) reports: the verdicts go in the job summary's
      table and in workflow commands, within the limits the description above gives, and the
      gate's verdicts never fail the job; an install or runtime
      error still can. "false" blocks: the job fails on a contradicted claim; on a claim the gate
      reports UNCHECKABLE because its PATH-2a overlay withheld a CONTRADICTED reading of it (the
      gate did not judge that claim, and its reading there may be wrong); and on a diff that could
      not be fetched or that the gate did not measure, while the description holds a claim the gate
      reads. Every other UNCHECKABLE claim fails it only with strict on. Any other value, the empty
      string included, reports as "true" does
      and prints a warning naming the value. The default was "false" until the change recorded
      in CHANGELOG.md ("the GitHub Action reports by default"); set soft-fail: "false" to keep a
      blocking check.
    required: false
    default: "true"
  styxx-version:
    description: >-
      styxx version spec that `pip install` is given before the script runs. It does
      NOT choose the gate. The gate that runs is the styxx package in this Action's own
      checkout, at the ref the workflow names in `uses:`, because the script imports the
      package beside it; what is installed supplies the one package that code imports
      from outside the standard library (numpy). To run another version of the gate,
      name another ref in `uses:`. A ref before v7.44.0 runs a gate with a bypass —
      `only touches <prefix>` was VERIFIED against an unreadable diff, because "is any
      path outside the prefix?" is vacuously false when no paths were parsed — and
      v7.44.2 additionally closes three false-accusation classes found by re-sweeping
      150 commits and 40 public agent PRs, so name no ref below v7.44.2. The default
      spec keeps that version as its floor.
    required: false
    default: "styxx>=7.44.2"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: pip install --quiet "${{ inputs.styxx-version }}"
    - shell: bash
      env:
        # the event payload path and token come from the runner; the PR body is read from
        # the event FILE by python — attacker-controlled text never touches a shell
        STYXX_STRICT: ${{ inputs.strict }}
        STYXX_SOFT_FAIL: ${{ inputs.soft-fail }}
        GH_TOKEN: ${{ github.token }}
      run: python "${{ github.action_path }}/diffgate_action.py"
