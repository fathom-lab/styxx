name: "styxx diffgate"
description: >-
  Your agent's PR summary cannot lie about its diff. Extracts diff-shaped claims from the
  PR body (or push commit message) and verifies each against the actual diff — checkout-free,
  via the GitHub API. Exits nonzero on a contradicted claim, with the lie named in the job
  summary and as an annotation. Re-validated at 7.44.2 against 150 commits and 40 real
  agent-authored public PRs — 30 claims, 21 VERIFIED, ZERO false accusations — and the
  sweep harness is committed (scripts/diffgate_validation_sweep.py) so you can re-run that
  number rather than take our word for it. It judges a CLOSED template set; prose outside
  it is never scored, and that limit is the reason to trust the verdicts it does give.
author: "Fathom Lab"
branding:
  icon: "shield"
  color: "gray-dark"

inputs:
  strict:
    description: "UNCHECKABLE claims (e.g. 'tests pass' with no way to run them) also fail the gate"
    required: false
    default: "false"
  soft-fail:
    description: "report everything, never fail the job (adoption ramp)"
    required: false
    default: "false"
  styxx-version:
    description: >-
      styxx version spec to install. The floor is deliberate. Every release before
      7.44.0 contained a bypass in this very gate — `only touches <prefix>` was
      VERIFIED against an unreadable diff, because "is any path outside the prefix?"
      is vacuously false when no paths were parsed. 7.44.2 additionally closes three
      false-accusation classes found by re-sweeping 150 commits and 40 public agent
      PRs. Do not pin below it.
    required: false
    default: "styxx>=7.44.2"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: pip install --quiet "${{ inputs.styxx-version }}"
    - shell: bash
      env:
        # the event payload path and token come from the runner; the PR body is read from
        # the event FILE by python — attacker-controlled text never touches a shell
        STYXX_STRICT: ${{ inputs.strict }}
        STYXX_SOFT_FAIL: ${{ inputs.soft-fail }}
        GH_TOKEN: ${{ github.token }}
      run: python "${{ github.action_path }}/diffgate_action.py"
