# The diff gate as a GitLab CI job: the merge request description vs the merge request diff.
#
#   include:
#     - remote: https://raw.githubusercontent.com/fathom-lab/styxx/main/integrations/gitlab/diffgate.gitlab-ci.yml
#
# or copy the job below into your .gitlab-ci.yml. It runs on merge request pipelines only, reads
# the description GitLab hands the job in CI_MERGE_REQUEST_DESCRIPTION (never through a shell
# expansion — the file is written with printf '%s'), and gates it against the diff between the
# merge request's diff base and its head. A sentence outside the closed template set is never
# judged, "tests pass" is UNCHECKABLE without evidence, and a path the diff does not show is
# UNCHECKABLE, never accused (EXTERNAL-1). Same instrument, same verdicts, same withholding as the
# GitHub Action and the CLI.
#
# GitLab stores only the leading 2,700 characters of a longer description in that variable and sets
# CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED to "true" (#209). The job then cuts the text back to its
# last whole sentence, keeping the white space after it, by the gate's own sentence split, so a
# sentence the cut broke is never read by the gate's templates; prints one line naming the cut, the
# characters it was handed and the characters the gate reads; prints CUT where the gate prints PASS,
# since a claim past the cut is never read; and adds "description_cut" to diffgate.json saying the
# same. A FAIL over a cut is the gate's FAIL over that prefix. PATH-2a's withholding (#121) and the
# one-styxx-block rule read the whole text the gate is handed, so the text the cut drops can change
# how the gate reads a whole sentence before it: when the gate FAILs over a cut, the job runs it again
# over the text GitLab handed it, and does not fail on a CONTRADICTED claim that run withholds or does
# not read; it names each one in the log and under "held_back". Text past GitLab's cut never reaches
# the job, so a claim the gate would withhold over the whole description can still be CONTRADICTED
# over the cut, as it was over GitLab's prefix before #209. A cut never fails the job by itself.
#
# It reports by default, as the GitHub Action does, and the gate's verdicts never fail the job.
# The gate's verdict, its claim counts and each CONTRADICTED or UNCHECKABLE claim go to the job
# log; every claim's verdict, VERIFIED included, goes to the diffgate.json artifact. Only
# STYXX_SOFT_FAIL set to "false" blocks: then the job fails on a CONTRADICTED claim, and on an
# UNCHECKABLE one too if --strict is added to the styxx.diffgate line. Set it in the project's
# CI/CD variables, in the pipeline's variables, or in this job's. A variable marked Protected in
# the project's or group's settings reaches a merge request pipeline only when its source and
# target branches are both protected branches of the same project and a maintainer has allowed
# merge request pipelines to access protected variables, and never from a fork; anywhere else the
# job sees it unset and reports, so leave Protect cleared or set the variable in .gitlab-ci.yml.
# The value is compared case-insensitively with surrounding whitespace stripped; unset reads as
# "true"; every other value, the empty string included, reports as "true" does, with a warning
# naming it. Every run that reaches the gate prints the mode it ran in. An install error, or a
# gate whose report does not match its exit (a PASS report for 0, a FAIL report for 1), fails the
# job either way. It does not block by default because no kind of accusation the gate still makes
# has been measured clearing the 0.95 precision floor the lab set for accusing (CHANGELOG.md, "the
# GitHub Action reports by default").

diffgate:
  image: python:3.12
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
    # STYXX_SOFT_FAIL: "false"    # uncomment to fail the job on a CONTRADICTED claim
  script:
    - pip install --quiet "styxx>=7.44.2"
    - git fetch --quiet origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - printf '%s' "$CI_MERGE_REQUEST_DESCRIPTION" > mr_description.md
    - |
      python - <<'STYXX_DESCRIPTION_CUT'
      import json, os, re
      # GitLab stores only the leading 2700 characters of a longer description in the variable and sets
      # CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED to "true" (#209). The gate then reads the text up to its last
      # whole sentence and the white space after it, cut where styxx.diffgate splits sentences, and the cut is named
      # here and in diffgate.json. The white space is kept because PATH-2a (#121) reads it: where the two readers read
      # it apart it withholds a claim of the sentence it ends. The text GitLab handed the job is kept beside it for
      # the gate's second run (STYXX_SOFT_FAIL_READ below).
      for stale in ("mr_description.cut.json", "mr_description.handed.md"):
          try:
              os.remove(stale)
          except FileNotFoundError:
              pass
      flag = os.environ.get("CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED")
      if flag is not None and flag.strip().lower() == "true":
          with open("mr_description.md", encoding="utf-8", newline="") as f:
              text = f.read()
          ends = [m.end() for m in re.finditer(r"(?<=[.!?])\s+|\n+", text)]
          kept = text[:ends[-1]] if ends else ""
          with open("mr_description.handed.md", "w", encoding="utf-8", newline="") as f:
              f.write(text)
          with open("mr_description.md", "w", encoding="utf-8", newline="") as f:
              f.write(kept)
          cut = {"CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED": flag,
                 "characters_handed": len(text), "characters_gated": len(kept),
                 "why": f"GitLab set CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED to {flag!r} and handed this job "
                        f"{len(text)} characters of the merge request description; the gate read the leading "
                        f"{len(kept)}, up to the last whole sentence, and never the rest. This record's verdict "
                        "is over that prefix, not over the description."}
          with open("mr_description.cut.json", "w", encoding="utf-8") as f:
              json.dump(cut, f)
          print(f"styxx diffgate: CUT. CI_MERGE_REQUEST_DESCRIPTION_IS_TRUNCATED is {flag!r}: GitLab handed this job "
                f"only the leading {len(text)} characters of the merge request description. The gate reads the "
                f"leading {len(kept)}, up to the last whole sentence, and never the rest: a claim past that point is "
                "never read and a sentence the cut broke is not judged, so this job prints CUT where the gate prints "
                "PASS.")
      STYXX_DESCRIPTION_CUT
    - rm -f diffgate.json diffgate.handed.json
    - |
      styxx_gate=0
      python -m styxx.diffgate mr_description.md --repo . --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --out diffgate.json > diffgate.log || styxx_gate=$?
      styxx_handed=none
      if [ "$styxx_gate" = 1 ] && [ -f mr_description.handed.md ]; then
      styxx_handed=0
      python -m styxx.diffgate mr_description.handed.md --repo . --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --out diffgate.handed.json > /dev/null || styxx_handed=$?
      fi
      python - "$styxx_gate" "$styxx_handed" <<'STYXX_SOFT_FAIL_READ'
      import json, os, re, sys
      gate = int(sys.argv[1])
      want = {0: "PASS", 1: "FAIL"}.get(gate)
      try:
          with open("diffgate.json", encoding="utf-8") as f:
              report = json.load(f)
          verdict = report.get("verdict")
      except Exception:
          report, verdict = None, None
      try:
          with open("mr_description.cut.json", encoding="utf-8") as f:
              cut = json.load(f)
      except FileNotFoundError:
          cut = None
      # The gate's output, captured above and printed here before anything else, so that over a description
      # GitLab cut its PASS prints as CUT (#209): a PASS over a prefix is not a PASS over the description.
      try:
          with open("diffgate.log", "rb") as f:
              out = f.read()
      except FileNotFoundError:
          out = b""
      if cut is not None and gate == 0 and verdict == "PASS":
          out = re.sub(rb"(?m)^PASS(?=\s)", b"CUT ", out)
      sys.stdout.flush()
      sys.stdout.buffer.write(out)
      sys.stdout.buffer.flush()
      raw = os.environ.get("STYXX_SOFT_FAIL")
      value = "true" if raw is None else raw.strip().lower()
      if value not in ("true", "false"):
          print(f"WARNING: STYXX_SOFT_FAIL is {raw!r}, which is neither \"true\" nor \"false\" (compared "
                "case-insensitively, surrounding whitespace stripped), so this job reports and does not "
                "fail. Set STYXX_SOFT_FAIL to \"false\" to fail it.")
      if value == "false":
          print("styxx diffgate mode: STYXX_SOFT_FAIL is \"false\", so a FAIL verdict fails this job.")
      elif raw is None:
          print("styxx diffgate mode: STYXX_SOFT_FAIL is not set, so this job reports and the gate's "
                "verdicts do not fail it. A variable marked Protected reaches a merge request pipeline "
                "only when its source and target branches are both protected branches of the same "
                "project and the project allows merge request pipelines to access protected variables; "
                "anywhere else this job sees it unset.")
      else:
          state = "reads as \"true\"" if value == "true" else "has a value this job does not recognise"
          print(f"styxx diffgate mode: STYXX_SOFT_FAIL {state}, so this job reports and the gate's "
                "verdicts do not fail it.")
      if want is None or verdict != want:
          print(f"styxx diffgate exited {gate} without writing a {want or 'matching'} report: that is an "
                "error, not a verdict, and it fails the job whatever STYXX_SOFT_FAIL says.")
          sys.exit(gate or 1)
      contradicted = [c for c in report.get("claims", []) if c.get("verdict") == "CONTRADICTED"]
      if cut is not None and gate == 1:
          # PATH-2a's withholding (#121) and the one-styxx-block rule read the whole text the gate is handed, and the
          # cut dropped some of it, so the gate ran again over the text GitLab handed this job. A CONTRADICTED claim of
          # the cut that this run withholds (PATH-2a's reason, a fixed form) or does not read is held back: named here
          # and in diffgate.json, and the job does not fail on it.
          handed_gate = None if sys.argv[2] == "none" else int(sys.argv[2])
          handed_want = {0: "PASS", 1: "FAIL"}.get(handed_gate)
          try:
              with open("diffgate.handed.json", encoding="utf-8") as f:
                  handed = json.load(f)
              handed_verdict = handed.get("verdict")
          except Exception:
              handed, handed_verdict = None, None
          if handed_want is None or handed_verdict != handed_want:
              ran = "did not run" if handed_gate is None else f"exited {handed_gate}"
              print(f"styxx diffgate {ran} over the text GitLab handed this job without writing a "
                    f"{handed_want or 'matching'} report: that is an error, not a verdict, and it fails the job "
                    "whatever STYXX_SOFT_FAIL says.")
              sys.exit(handed_gate or 1)

          def same(c):
              return c.get("kind"), c.get("text"), json.dumps(c.get("detail"), sort_keys=True)

          read = {}
          for c in handed.get("claims", []):
              read.setdefault(same(c), []).append(c)
          withheld = "CONTRADICTED withheld by PATH-2a ("
          cut["held_back"] = []
          for c in contradicted:
              there = read.get(same(c), [])
              if all(o.get("verdict") == "UNCHECKABLE" and str(o.get("why")).startswith(withheld) for o in there):
                  cut["held_back"].append({"kind": c.get("kind"), "text": c.get("text"),
                                           "over_the_handed_text": there[0].get("why") if there else None})
      if cut is not None:
          report["description_cut"] = cut
          with open("diffgate.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(report, indent=2) + "\n")
      if gate == 0:
          if cut is not None:
              print(f"styxx diffgate: CUT. Nothing in the leading {cut['characters_gated']} characters the gate read "
                    "failed it, and the rest of the description was never read, so this job does not call the "
                    "description a pass. diffgate.json keeps the gate's verdict over that prefix and names the cut "
                    "under \"description_cut\".")
          sys.exit(0)
      if cut is not None:
          for h in cut["held_back"]:
              how = "withholds it" if h["over_the_handed_text"] is not None else "reads no such claim"
              print(f"styxx diffgate: CUT. The gate reads {h['kind']} \"{h['text']}\" as CONTRADICTED over the leading "
                    f"{cut['characters_gated']} characters, but over the {cut['characters_handed']} characters GitLab "
                    f"handed this job it {how}: the text the cut dropped changes how the gate reads that claim, so "
                    "this job does not fail on it.")
          if cut["held_back"] and len(cut["held_back"]) == len(contradicted):
              print("styxx diffgate: CUT. Every CONTRADICTED claim of the gate's FAIL over the cut is named above, so "
                    "this job does not fail on that FAIL, in either mode. diffgate.json keeps the gate's verdict over "
                    "that prefix and names them under \"description_cut\", \"held_back\".")
              sys.exit(0)
      if value == "false":
          print("styxx diffgate: FAIL, and STYXX_SOFT_FAIL is \"false\", so the job fails.")
          sys.exit(1)
      why = ("is on, as it is by default" if value == "true" else
             "has a value this job does not recognise (named above), so it reports as it does by default")
      print(f"WARNING: styxx diffgate found failures but STYXX_SOFT_FAIL {why}, so the job passes; set "
            "STYXX_SOFT_FAIL to \"false\" to fail it.")
      STYXX_SOFT_FAIL_READ
  artifacts:
    when: always
    paths:
      - diffgate.json
    expire_in: 30 days
